<script type="text/javascript">

function findCmCityid(){
    var cookies =  document.cookie.split("; ");
    var CmLocation = null;
    for ( var i = 0; i < cookies.length; i++) {
        var arr = cookies[i].split("=");
        if ("CmLocation" == arr[0]) {
            CmLocation = arr[1];
            break;
        }
    }
    return CmLocation;
}

function getCityId() {
	var cityId = null;
	for(var i=0;i<prov_code.length;i++){
		var re = urlProv.indexOf("/" + prov_code[i].abbr+"/");
		if (re != -1) {
			cityId = prov_code[i].code;
			break;
		}
	}
	return cityId;
}

// 获得引流cookie
function findCmChannelID() {
    var cookies =  document.cookie.split("; ");
    var cmChannelID = null;
    for (var i = 0; i < cookies.length; i++) {
        var arr = cookies[i].split("=");
        if ("CmChannelID" == arr[0]) {
            cmChannelID = arr[1];
            break;
        }
    }
    return cmChannelID;
}

// 判断是否是首页
function isHomePage(pathname) {
	var rv = false;
	
	for(var i=0;i<prov_code.length;i++){
		var re = pathname.indexOf("/" + prov_code[i].abbr+"/");
		if (re == 0) {
			rv = true;
			break;
		}
	}
	
	return rv;
}

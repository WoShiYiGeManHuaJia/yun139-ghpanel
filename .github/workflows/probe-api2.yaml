name: probe-api2
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p data && python3 probe_api2.py 2>&1 | tee data/probe_api2.txt
        env:
          CMCC_COOKIE: ${{ secrets.CMCC_COOKIE }}
      - name: commit
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -f data/probe_api2.txt
          git commit -m pa2 || echo no-change
          git push || echo nothing

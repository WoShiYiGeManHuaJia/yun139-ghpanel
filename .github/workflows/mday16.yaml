name: yun139-mday16

# 每月16号会员日（星动日）自动抢奖品 —— 优先目标：星巴克
#
# 官方规则（活动规则页）：每月16日10点开启，奖品分三场补货
#   钻石会员 / 云手机至尊版：10:00、12:00、15:00
#   黄金 / 白银会员：        10:30、12:30、15:30   ← 我们的号是黄金+白银
# 所以一天有三枪，不是只有早上一次。
#
# 三场各提前 5 分钟启动（预热+等开闸）；GitHub cron 用 UTC 且可能延迟数分钟。
on:
  schedule:
    # 实测（09-16）：GitHub cron 延迟可达 7 分钟以上，原 12:25 启动实际 12:32 才跑，
    # 开闸瞬间（12:30）已过，进去就是 415「单日已耗尽」。
    # 故每场都大幅提前启动，用脚本内部长轮询等开闸，把 cron 延迟吃掉。
    - cron: '50 0 16 * *'    # 北京 08:50 → 抢 10:30 场（提前 100 分钟）
    - cron: '55 3 16 * *'    # 北京 11:55 → 抢 12:30 场（提前 35 分钟）
    - cron: '55 6 16 * *'    # 北京 14:55 → 抢 15:30 场（提前 35 分钟）
  workflow_dispatch:
    inputs:
      mode:
        description: 'query=只查资格 / grab=自动抢'
        required: false
        default: 'grab'
        type: string

permissions:
  contents: write

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    concurrency:
      group: yun139-mday16
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # 按 UTC 小时判断场次（用区间匹配，cron 迟到也能归到正确场次）：
      #   00-01 → 早场（北京 08:50 起，等 10:30，约 100 分钟）
      #   03-04 → 中场（北京 11:55 起，等 12:30，约 35 分钟）
      #   06-07 → 晚场（北京 14:55 起，等 15:30，约 35 分钟）
      # 每档都再加 20 分钟余量，覆盖 cron 自身延迟。
      - name: 计算本场等待上限
        id: cfg
        run: |
          H=$(date -u +%H)
          case "$H" in
            00|01) W=7200 ;;   # 早场：100 分钟 + 20 分钟余量
            03|04) W=3300 ;;   # 中场：35 分钟 + 20 分钟余量
            06|07) W=3300 ;;   # 晚场：35 分钟 + 20 分钟余量
            *)     W=3300 ;;
          esac
          echo "maxWaitSec=$W" >> "$GITHUB_OUTPUT"
          echo "本场 UTC 小时=$H 等待上限=${W}s"

      - name: Run mday16
        env:
          EVENT_TYPE: mday16
          PAYLOAD: ${{ github.event.inputs.mode && format('{{"mode":"{0}","priority":"星巴克","maxWaitSec":{1},"fastPollSec":5,"grabRounds":8,"fastLaneMs":180000,"exclude":"支付宝","rushBeforeSec":20,"rushIntervalMs":500,"rushWindowSec":600,"exhaustAbort":5}}', github.event.inputs.mode, steps.cfg.outputs.maxWaitSec) || format('{{"mode":"grab","priority":"星巴克","maxWaitSec":{0},"fastPollSec":5,"grabRounds":8,"fastLaneMs":180000,"exclude":"支付宝","rushBeforeSec":20,"rushIntervalMs":500,"rushWindowSec":600,"exhaustAbort":5}}', steps.cfg.outputs.maxWaitSec) }}
          PANEL_DATA_KEY: ${{ secrets.PANEL_DATA_KEY }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: node actions/run.js
      - name: Commit result
        run: |
          set -e
          git config user.name "yun139-panel-bot"
          git config user.email "yun139-panel-bot@users.noreply.github.com"
          mkdir -p /tmp/mdayout
          cp data/result.json /tmp/mdayout/result.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main FETCH_HEAD
            cp /tmp/mdayout/result.json data/result.json
            git add data/result.json
            if git diff --cached --quiet; then echo "无变化"; break; fi
            if git commit -m "mday16 会员日抢购结果 $(date -u +'%Y-%m-%d %H:%M UTC')" && git push origin main; then
              echo "推送成功"; break
            fi
            echo "推送失败，重试 $i"; sleep 8
          done

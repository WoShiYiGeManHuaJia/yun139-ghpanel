name: yun139-panel-task

on:
  repository_dispatch:
    types: [sign, refresh, send_code, do_login]

permissions:
  contents: write

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Execute task
        env:
          EVENT_TYPE: ${{ github.event.action }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
          PANEL_DATA_KEY: ${{ secrets.PANEL_DATA_KEY }}
        run: node actions/run.mjs

      - name: Commit result
        run: |
          git config user.name "yun139-panel-bot"
          git config user.email "yun139-panel-bot@users.noreply.github.com"
          git add data/result.json
          git commit -m "chore: update panel result $(date -u +%Y%m%d%H%M%S)" || echo "no change"
          git push

name: yun139-panel-task

on:
  repository_dispatch:
    types: [sign, refresh, send_code, do_login, task, receive, daily, status]
  workflow_dispatch:
    inputs:
      event_type:
        description: 事件类型 sign/refresh/send_code/do_login/task/receive/daily/status
        required: true
        type: string
      payload:
        description: JSON payload 字符串
        required: false
        type: string

permissions:
  contents: write

jobs:
  run-task:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install playwright (气泡领取需要)
        env:
          ET: ${{ github.event.action || inputs.event_type }}
        run: |
          if [ "$ET" = "receive" ] || [ "$ET" = "daily" ]; then
            npm i playwright@1.49.1
            npx playwright install chromium
          else
            echo "跳过 playwright 安装"
          fi

      - name: Execute task
        env:
          EVENT_TYPE: ${{ github.event.action || inputs.event_type }}
          PAYLOAD: ${{ github.event.client_payload != null && toJson(github.event.client_payload) || inputs.payload || '' }}
          PANEL_DATA_KEY: ${{ secrets.PANEL_DATA_KEY }}
          YUN139_AUTHORIZATION: ${{ secrets.YUN139_AUTHORIZATION }}
          YUN139_PHONE: ${{ secrets.YUN139_PHONE }}
        run: node actions/run.mjs

      - name: Commit result
        run: |
          git config user.name "yun139-panel-bot"
          git config user.email "yun139-panel-bot@users.noreply.github.com"
          git add data/result.json
          git commit -m "chore: update panel result $(date -u +%Y%m%d%H%M%S)" || echo "no change"
          git push

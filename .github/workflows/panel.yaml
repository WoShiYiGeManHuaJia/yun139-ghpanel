name: yun139-panel-task

on:
  repository_dispatch:
    types: [sign, refresh, send_code, do_login, task, receive, daily, status, sync]
  workflow_dispatch:
    inputs:
      event_type:
        description: 事件类型 sign/refresh/send_code/do_login/task/receive/daily/status/sync
        required: true
        type: string
      payload:
        description: JSON payload 字符串
        required: false
        type: string

permissions:
  contents: write

jobs:
  run-task:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # 同一时刻只允许一个任务写 result.json，避免并发 push 冲突
    concurrency:
      group: yun139-panel-result
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install playwright (气泡领取需要)
        env:
          ET: ${{ github.event.action || inputs.event_type }}
        run: |
          if [ "$ET" = "receive" ] || [ "$ET" = "daily" ]; then
            npm i --no-audit --no-fund playwright@1.63.0
            npx playwright install chromium
          else
            echo "跳过 playwright 安装"
          fi

      - name: Execute task
        env:
          EVENT_TYPE: ${{ github.event.action || inputs.event_type }}
          PAYLOAD: ${{ github.event.client_payload != null && toJson(github.event.client_payload) || inputs.payload || '' }}
          PANEL_DATA_KEY: ${{ secrets.PANEL_DATA_KEY }}
          YUN139_AUTHORIZATION: ${{ secrets.YUN139_AUTHORIZATION }}
          YUN139_PHONE: ${{ secrets.YUN139_PHONE }}
        run: node actions/run.js

      - name: Commit result
        run: |
          set -e
          git config user.name "yun139-panel-bot"
          git config user.email "yun139-panel-bot@users.noreply.github.com"
          # 先保存本次运行结果，后面切分支不会丢失
          mkdir -p /tmp/panelout
          cp data/result.json /tmp/panelout/result.json
          if [ -f data/accounts.enc ]; then cp data/accounts.enc /tmp/panelout/accounts.enc; fi
          for i in 1 2 3 4 5; do
            git fetch origin main
            # 基于远端最新 main 重建分支（accounts.enc 是二进制，用 rebase 必然冲突）
            git checkout -f -B main FETCH_HEAD
            cp /tmp/panelout/result.json data/result.json
            if [ -f /tmp/panelout/accounts.enc ]; then cp /tmp/panelout/accounts.enc data/accounts.enc; fi
            git add data/result.json
            if [ -f data/accounts.enc ]; then git add data/accounts.enc; fi
            if git diff --cached --quiet; then
              echo "结果无变化，跳过提交"
              exit 0
            fi
            git commit -m "chore: update panel result $(date -u +%Y%m%d%H%M%S)"
            if git push origin main; then
              echo "提交成功"
              exit 0
            fi
            echo "第 $i 次提交失败，重试…"
            sleep 8
          done
          echo "提交失败：已达到最大重试次数"
          exit 1

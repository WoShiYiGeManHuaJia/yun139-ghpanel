name: pm3
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install pycryptodome -q
      - run: mkdir -p data && python3 pm3.py 2>&1 | tee data/pm3.txt
        env:
          CMCC_CK2: ${{ secrets.CMCC_CK2 }}
      - name: commit
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -f data/pm3.txt data/pm3_files 2>/dev/null || true
          git add -f data/op_*.txt data/idx.html 2>/dev/null || true
          git commit -m pm3 || echo no-change
          git pull --rebase origin main || true
          git push || echo nothing

name: probe-memberday
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Probe
        env:
          PROBE_AUTH: ${{ secrets.PROBE_AUTH }}
          PROBE_PHONE: ${{ secrets.PROBE_PHONE }}
        run: node .github/probe_mcd.mjs 2>&1 | tee probe.log
      - name: Commit result
        run: |
          set -e
          git config user.name "probe-bot"
          git config user.email "probe@bot"
          git add -f data/probe_mcd.json probe.log || true
          git commit -m "probe: memberday $(date -u +%Y%m%d%H%M%S)" || echo "no change"
          for i in 1 2 3 4 5; do git pull --rebase -X ours origin main && git push && break || sleep 5; done

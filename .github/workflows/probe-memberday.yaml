name: probe-memberday
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Probe
        env:
          PROBE_AUTH: ${{ secrets.PROBE_AUTH }}
          PROBE_PHONE: ${{ secrets.PROBE_PHONE }}
        run: node .github/probe_mcd.mjs 2>&1 | tee probe.log
      - uses: actions/upload-artifact@v4
        with:
          name: probe-log
          path: probe.log

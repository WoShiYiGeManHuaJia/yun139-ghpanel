name: yun139-probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install playwright
        run: |
          npm i playwright@1.49.1
          npx playwright install chromium
      - name: Run probe
        env:
          YUN139_AUTHORIZATION: ${{ secrets.YUN139_AUTHORIZATION }}
          YUN139_PHONE: ${{ secrets.YUN139_PHONE }}
        run: node actions/probe.mjs
      - name: Commit probe result
        run: |
          git config user.name "yun139-panel-bot"
          git config user.email "yun139-panel-bot@users.noreply.github.com"
          git add data/probe.json
          git commit -m "probe: $(date -u +%Y%m%d%H%M%S)" || echo "no change"
          git push

name: yun139-daily

on:
  schedule:
    # GitHub schedule 高峰期常延迟数小时甚至整天不触发，故设 4 个时间点兜底
    # 幂等由 guard job 保证：北京日期当天跑过就不再跑，也不会重复推钉钉
    - cron: "5 1 * * *"     # 北京 09:05
    - cron: "5 5 * * *"     # 北京 13:05
    - cron: "5 9 * * *"     # 北京 17:05
    - cron: "5 12 * * *"    # 北京 20:05
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手动触发 → 强制执行"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY="$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          # 旧逻辑只看 ts 日期，不看成败：某轮 4 个账号只成功 1 个，
          # ts 却已落到当天，于是当天后续调度全部判「已跑过」跳过，
          # 3 个账号整天不再重试 —— 这正是本次「签到炸了」的直接原因。
          # 改为：先看是否全部账号成功，再看当天已重试次数（上限 3 次）。
          EVAL="$(node -e '
            const fs=require("fs");
            let j={}; try{ j=JSON.parse(fs.readFileSync("./data/result.json","utf8")); }catch(e){}
            const s=(j.ts||"").trim();
            let d="";
            if(s){ const x=new Date(s.replace(" ","T")+"Z"); d=new Date(x.getTime()+8*3600e3).toISOString().slice(0,10); }
            const pa=Array.isArray(j.perAccount)?j.perAccount:[];
            const fail=pa.filter(a=>a&&a.ok===false).length;
            // 全部成功才算完成（无任何失败账号，且确实有账号被处理）
            const done = pa.length>0 && fail===0 && d!=="";
            const rt = Number(j._retryToday||0);
            console.log(JSON.stringify({date:d, total:pa.length, fail, done, retry:rt}));
          ' 2>/dev/null || echo '{}')"
          echo "北京今天=$TODAY ; 上次结果=$EVAL"
          DATE="$(echo "$EVAL" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).date||"")}catch(e){console.log("")}})')"
          DONE="$(echo "$EVAL" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).done?"1":"0")}catch(e){console.log("0")}})')"
          RT="$(echo "$EVAL" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).retry||0)}catch(e){console.log(0)}})')"
          if [ "$DATE" = "$TODAY" ] && [ "$DONE" = "1" ]; then
            echo "今天已全部账号成功 → 跳过，避免重复签到与重复钉钉推送"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$DATE" = "$TODAY" ] && [ "$RT" -ge 3 ]; then
            echo "今天已重试 $RT 次仍存在失败账号 → 停止重试，避免无限重跑"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "今天尚未全部成功（已重试 $RT 次）→ 执行"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  daily:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: yun139-panel-result
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装 Playwright（气泡领取需要真实浏览器）
        run: |
          npm i --no-audit --no-fund playwright@1.63.0
          npx playwright install chromium

      - name: 第 1 轮：续期 + 任务 + 气泡
        id: round1
        continue-on-error: true
        env:
          EVENT_TYPE: daily
          PAYLOAD: "{}"
          PANEL_DATA_KEY: ${{ secrets.PANEL_DATA_KEY }}
          YUN139_AUTHORIZATION: ${{ secrets.YUN139_AUTHORIZATION }}
          YUN139_PHONE: ${{ secrets.YUN139_PHONE }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: node actions/run.js

      - name: 第 1 轮全失败，等 6 分钟自动重跑
        if: steps.round1.outcome == 'failure'
        env:
          EVENT_TYPE: daily
          PAYLOAD: "{}"
          PANEL_DATA_KEY: ${{ secrets.PANEL_DATA_KEY }}
          YUN139_AUTHORIZATION: ${{ secrets.YUN139_AUTHORIZATION }}
          YUN139_PHONE: ${{ secrets.YUN139_PHONE }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          echo "第 1 轮失败（多为机房瞬时网络故障），等待 6 分钟后重试"
          sleep 360
          node actions/run.js

      - name: 记录当天重试次数（供 guard 判断是否继续重试）
        if: always()
        run: |
          node -e '
            const fs=require("fs");
            const p="./data/result.json";
            let j={}; try{ j=JSON.parse(fs.readFileSync(p,"utf8")); }catch(e){ j={}; }
            const s=(j.ts||"").trim();
            let d="";
            if(s){ const x=new Date(s.replace(" ","T")+"Z"); d=new Date(x.getTime()+8*3600e3).toISOString().slice(0,10); }
            const today=new Date(Date.now()+8*3600e3).toISOString().slice(0,10);
            j._retryToday = (d && d===today) ? Number(j._retryToday||0)+1 : 1;
            j._retryDate = today;
            fs.writeFileSync(p, JSON.stringify(j,null,2));
            console.log("retryToday =", j._retryToday, "date =", today);
          ' 2>&1 || echo "[警告] 重试计数写入失败，不影响结果提交"

      - name: Commit result
        if: always()
        run: |
          set -e
          git config user.name "yun139-panel-bot"
          git config user.email "yun139-panel-bot@users.noreply.github.com"
          mkdir -p /tmp/panelout
          cp data/result.json /tmp/panelout/result.json
          if [ -f data/totals.json ]; then cp data/totals.json /tmp/panelout/totals.json; fi
          if [ -f data/accounts.enc ]; then cp data/accounts.enc /tmp/panelout/accounts.enc; fi
          for i in 1 2 3 4 5; do
            git fetch origin main
            git checkout -f -B main FETCH_HEAD
            cp /tmp/panelout/result.json data/result.json
            if [ -f /tmp/panelout/totals.json ]; then cp /tmp/panelout/totals.json data/totals.json; fi
            if [ -f /tmp/panelout/accounts.enc ]; then cp /tmp/panelout/accounts.enc data/accounts.enc; fi
            git add data/result.json
            if [ -f data/totals.json ]; then git add data/totals.json; fi
            if [ -f data/accounts.enc ]; then git add data/accounts.enc; fi
            if git diff --cached --quiet; then
              echo "结果无变化，跳过提交"
              exit 0
            fi
            git commit -m "chore: update panel result $(date -u +%Y%m%d%H%M%S)"
            if git push origin main; then
              echo "提交成功"
              exit 0
            fi
            echo "第 $i 次提交失败，重试…"
            sleep 8
          done
          echo "提交失败：已达到最大重试次数"
          exit 1

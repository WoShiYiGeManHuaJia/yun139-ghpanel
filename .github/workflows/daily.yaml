name: yun139-daily

on:
  schedule:
    - cron: "5 1 * * *"     # 北京 09:05 每天
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装 Playwright（气泡领取需要真实浏览器）
        run: |
          npm i playwright@1.49.1
          npx playwright install chromium
      - name: 自动续期令牌 + 执行云朵任务 + 领取气泡
        env:
          EVENT_TYPE: daily
          PAYLOAD: "{}"
          YUN139_AUTHORIZATION: ${{ secrets.YUN139_AUTHORIZATION }}
          YUN139_PHONE: ${{ secrets.YUN139_PHONE }}
        run: node actions/run.mjs
      - name: 回写结果
        run: |
          git config user.name "yun139-panel-bot"
          git config user.email "yun139-panel-bot@users.noreply.github.com"
          git add data/result.json
          git commit -m "daily: $(date -u +%Y%m%d%H%M%S)" || echo "no change"
          git push

name: yun139-daily

on:
  schedule:
    - cron: "5 1 * * *"     # 北京 09:05 每天
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: yun139-panel-result
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装 Playwright（气泡领取需要真实浏览器）
        run: |
          npm i playwright@1.49.1
          npx playwright install chromium
      - name: 自动续期令牌 + 执行云朵任务 + 领取气泡
        env:
          EVENT_TYPE: daily
          PAYLOAD: "{}"
          PANEL_DATA_KEY: ${{ secrets.PANEL_DATA_KEY }}
          YUN139_AUTHORIZATION: ${{ secrets.YUN139_AUTHORIZATION }}
          YUN139_PHONE: ${{ secrets.YUN139_PHONE }}
        run: node actions/run.mjs
      - name: 回写结果
        run: |
          set -e
          git config user.name "yun139-panel-bot"
          git config user.email "yun139-panel-bot@users.noreply.github.com"
          git add data/result.json
          # 续期后的新令牌写入加密账号文件，下次定时任务才能用上
          if [ -f data/accounts.enc ]; then git add data/accounts.enc; fi
          if git diff --cached --quiet; then
            echo "结果无变化，跳过提交"
            exit 0
          fi
          git commit -m "daily: $(date -u +%Y%m%d%H%M%S)"
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "提交成功"
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "第 $i 次提交失败，重试…"
            sleep 8
          done
          echo "提交失败：已达到最大重试次数"
          exit 1

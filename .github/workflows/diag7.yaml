name: diag7
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i playwright@1.49.0 --no-audit --no-fund
      - run: npx playwright install chromium --with-deps
      - run: node diag7.js 2>&1 | tee data/d7.log
        env:
          CMCC_CK2: ${{ secrets.CMCC_CK2 }}
      - name: commit
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -f data/d7.json data/d7.log
          git add -f data/d7_*.png 2>/dev/null || true
          git commit -m d7 || echo no-change
          git pull --rebase origin main || true
          git push || echo nothing

name: probe-yun
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p data && python3 probe_yun.py 2>&1 | tee data/probe_yun.txt
        env:
          YUN139_COOKIE: ${{ secrets.YUN139_COOKIE }}
      - name: commit
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -f data/probe_yun.txt
          git commit -m py || echo no-change
          git push || echo nothing

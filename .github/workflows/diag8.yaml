name: diag8
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node actions/diag8.js 2>&1 | tee data/d8.log
        env:
          PANEL_DATA_KEY: ${{ secrets.PANEL_DATA_KEY }}
      - name: commit
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -f data/d8.json data/d8.log
          git commit -m "diag8 $(date -u +%Y%m%d%H%M%S)" || echo no-change
          git pull --rebase origin main || true
          git push || echo nothing

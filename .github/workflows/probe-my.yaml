name: probe-my
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p data && python3 probe_my.py 2>&1 | tee data/pm2.txt
        env:
          CMCC_CK2: ${{ secrets.CMCC_CK2 }}
      - name: commit
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -f data/pm2.txt
          git commit -m pm2 || echo no-change
          git pull --rebase origin main || true
          git push || echo nothing

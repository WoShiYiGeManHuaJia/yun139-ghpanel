name: probe-my
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p data && python3 probe_my.py 2>&1 | tee data/probe_my.txt
        env:
          CMCC_CK2: ${{ secrets.CMCC_CK2 }}
      - name: commit
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -f data/
          git commit -m pm || echo no-change
          git push || echo nothing

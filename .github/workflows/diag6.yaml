name: yun139-diag6
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装 Playwright
        run: |
          npm i --no-audit --no-fund playwright@1.63.0
          npx playwright install chromium
      - name: 运行
        env:
          DIAG_PHONE: "17274079953"
          DIAG_AUTH: ${{ secrets.DIAG_AUTH_9953 }}
          TARGETS: "https://yun.139.com/m/#/main,https://m.mcloud.139.com/portal/mobilecloud/index.html?path=newsignin&sourceid=1427"
        run: node actions/diag6.js
      - name: 保存
        run: |
          mkdir -p data
          cp /tmp/diag6/out.json data/diag6.json || echo none
          for f in /tmp/diag6/*.png; do cp "$f" data/ 2>/dev/null || true; done
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout -f -B main $(git rev-parse HEAD)
          git add -f data/diag6.json data/s_*.png
          git diff --cached --quiet && echo 无变化 || git commit -m "diag6: 云盘H5余额接口"
          git push origin main || echo skip

name: probe_click
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: yun139-panel-result
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install playwright
        run: |
          npm i --no-audit --no-fund playwright@1.63.0
          npx playwright install chromium
      - name: Click probe
        env:
          PANEL_DATA_KEY: ${{ secrets.PANEL_DATA_KEY }}
        run: node actions/probe_click.js
      - name: Commit
        run: |
          set -e
          git config user.name "yun139-panel-bot"
          git config user.email "yun139-panel-bot@users.noreply.github.com"
          mkdir -p /tmp/p
          cp data/probe_click.json /tmp/p/
          for i in 1 2 3 4 5; do
            git fetch origin main
            git checkout -f -B main FETCH_HEAD
            cp /tmp/p/probe_click.json data/
            git add data/probe_click.json
            if git diff --cached --quiet; then echo "无变化"; exit 0; fi
            git commit -m "probe click: $(date -u +%Y%m%d%H%M%S)"
            if git push origin main; then exit 0; fi
            sleep 8
          done
          exit 1
